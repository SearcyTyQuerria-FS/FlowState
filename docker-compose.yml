version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: flowstate-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - flowstate-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flowstate-server
    environment:
      NODE_ENV: development
      PORT: 5001
      MONGO_URI: mongodb://admin:password@mongodb:27017/flowstate?authSource=admin
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: http://localhost:5001/auth/callback
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "5001:5001"
    depends_on:
      - mongodb
    networks:
      - flowstate-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: flowstate-client
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - flowstate-network

volumes:
  mongodb_data:

networks:
  flowstate-network:
    driver: bridge
