version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: flowstate-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - flowstate-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flowstate-server
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 5001
      # Google login
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      CLIENT_URL: ${CLIENT_URL}
      # App session + database
      JWT_SECRET: ${JWT_SECRET}
      MONGO_URI: ${MONGO_URI}
      # Spotify music connect 
      #TODO: Add later
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI}
    ports:
      - "5001:5001"
    depends_on:
      - mongodb
    networks:
      - flowstate-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: flowstate-client
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - flowstate-network

volumes:
  mongodb_data:

networks:
  flowstate-network:
    driver: bridge
